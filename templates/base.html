<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}ReffPlace{% endblock %}</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <header>
        <h1><a href="{{ url_for('dashboard.inicio') }}">ReffPlace</a></h1>
        <p>Sistema de gerenciamento</p>
        <nav>
            <a href="{{ url_for('dashboard.inicio') }}">Dashboard</a>
            <a href="{{ url_for('pedidos.historico') }}">Histórico</a>
            <a href="{{ url_for('pedidos.novo') }}">Novo pedido</a>
        </nav>
    </header>

    <main>
        {% with messages = get_flashed_messages() %}
            {% if messages %}
                <ul class="flashes">
                    {% for mensagem in messages %}
                        <li>{{ mensagem }}</li>
                    {% endfor %}
                </ul>
            {% endif %}
        {% endwith %}

        {% block content %}{% endblock %}
    </main>

</body>
</html>
