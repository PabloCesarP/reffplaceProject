{% extends "base.html" %}

{% block title %}Novo pedido{% endblock %}

{% block content %}

<h2>Novo pedido</h2>

<div class="card">
    <form method="POST">
        <label for="nome">Nome do pedido</label>
        <input type="text" id="nome" name="nome" required placeholder="Ex: Haul desse mês">

        <label for="peso_primario">Peso Primário - valor até 1kg do pedido (¥)</label>
        <input type="number" step="0.01" id="peso_primario" name="peso_primario" value="217">

        <label for="peso_secundario">Peso Secundário - valor por kg adicional após 1kg (¥)</label>
        <input type="number" step="0.01" id="peso_secundario" name="peso_secundario" value="75">

        <label for="seguro_pct">Seguro (% sobre Preço + Fretes) — em fração, ex: 0.06 = 6%</label>
        <input type="number" step="0.0001" id="seguro_pct" name="seguro_pct" value="0.06">

        <label for="taxa_servico_pct">Taxa de Serviço (% sobre subtotal em ¥) — em fração, ex: 0.03 = 3%</label>
        <input type="number" step="0.0001" id="taxa_servico_pct" name="taxa_servico_pct" value="0.03">

        <label for="cotacao">Cotação (R$ por ¥)</label>
        <input type="number" step="0.0001" id="cotacao" name="cotacao" value="1.2">

        <button type="submit">Criar pedido</button>
    </form>
</div>

{% endblock %}
